name: Version Tag and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact semver version, for example 0.2.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  tag_and_release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Validate changelog and prepare release notes
        env:
          VERSION: ${{ inputs.version }}
        run: |
          test "$(node -p "require('./package.json').version")" = "$VERSION"
          node scripts/release-notes.mjs "$VERSION" release-notes.md

      - run: pnpm run verify
      - run: pnpm run build:demo
      - run: pnpm pack --dry-run

      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:e2e

      - name: Tag the verified package
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "v$VERSION"
          git push origin "v$VERSION"

      - name: Create GitHub release from changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: gh release create "v$VERSION" --title "Release v$VERSION" --notes-file release-notes.md --latest
